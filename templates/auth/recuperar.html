<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recuperar contraseña · Lexfixer</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/lexfixer-icon.png') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/ux.css') }}">
</head>

<body>
  <main id="app">
    <section class="auth-screen">
      <div class="auth-card recovery-card">
        <div class="auth-symbol"><i class="bi bi-lock icon" aria-hidden="true"></i></div>
        <h1 class="auth-title" tabindex="-1">¿Olvidaste tu contraseña?</h1>
        <p class="auth-subtitle">Por ahora la contraseña la restablece el administrador del sistema.</p>
        <div class="flash flash-info" role="status"><span>El envío de correos no está disponible por el momento.
            <strong>Contacta al administrador</strong> para restablecer tu contraseña.</span></div><a class="back-link"
          href="{{ url_for('auth.login') }}"><i class="bi bi-arrow-left icon" aria-hidden="true"></i>Volver a inicio de
          sesión</a>
      </div>
    </section>
  </main>
</body>

</html>
