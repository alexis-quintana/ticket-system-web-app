<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#333f4a">
  <title>{% block titulo %}Inicio{% endblock %} · Sistema de Tickets TI</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/lexfixer-icon.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tickets.css') }}">
  {% block css_extra %}{% endblock %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/users.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/notifications.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/reports.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/settings.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/polish.css') }}">
</head>
<body{% block body_attrs %}{% endblock %}>
  <a class="skip-link" href="#page-content">Saltar al contenido</a>
  {% block body %}{% endblock %}
  <dialog id="modal" aria-label="Detalles"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>Activa JavaScript para usar el Sistema de Tickets TI.</noscript>
  {% block js %}{% endblock %}
  </body>

</html>
